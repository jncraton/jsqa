<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikidata Q&A</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color-scheme: light dark;
      }
      body {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:disabled {
        background: #ccc;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        border-left: 5px solid #007bff;
        background: #f9f9f9;
        display: none;
      }
      .error {
        color: #d9534f;
      }
      [data-theme='dark'] #result {
        background: #222;
      }
    </style>
  </head>
  <body>
    <h1>Wikidata Knowledge Bot</h1>
    <p>Ask a question in the format: <strong>"What is the {property} of {entity}?"</strong></p>

    <form id="qa-form">
      <input type="text" id="question" placeholder="e.g. What is the mass of Saturn?" required />
      <button type="submit" id="submit-btn">Ask Question</button>
    </form>

    <div id="result"></div>

    <script>
      const API_URL = 'https://www.wikidata.org/w/api.php'

      async function wikidataFetch(params) {
        const url = new URL(API_URL)
        params.origin = '*'
        params.format = 'json'
        Object.keys(params).forEach(key => url.searchParams.append(key, params[key]))

        const response = await fetch(url)
        return await response.json()
      }

      async function search(query, type = 'item') {
        const data = await wikidataFetch({
          action: 'wbsearchentities',
          search: query,
          language: 'en',
          type: type,
        })
        return data.search || []
      }

      async function getLabel(entityId) {
        const id = entityId.split('/').pop()
        const data = await wikidataFetch({
          action: 'wbgetentities',
          ids: id,
          props: 'labels',
          languages: 'en',
        })
        return data.entities[id].labels.en.value
      }

      async function getPropValue(entityId, propId) {
        const data = await wikidataFetch({
          action: 'wbgetentities',
          ids: entityId,
          props: 'claims',
          languages: 'en',
        })

        try {
          const claim = data.entities[entityId].claims[propId][0].mainsnak
          const datavalue = claim.datavalue.value
          let value = ''

          if (datavalue.amount) {
            value = datavalue.amount.replace(/^\+/, '')
            if (datavalue.unit && datavalue.unit !== '1') {
              const unitLabel = await getLabel(datavalue.unit)
              value += ` ${unitLabel}`
            }
          } else if (datavalue.time) {
            value = datavalue.time
          } else if (datavalue.id) {
            value = await getLabel(datavalue.id)
          } else {
            value = datavalue
          }
          return value
        } catch (e) {
          return null
        }
      }

      async function answer(question) {
        const match = question.match(/What is the (.+) of (.+)\?/i)
        if (!match) return "Please use the format: 'What is the {property} of {entity}?'"

        const propQuery = match[1].trim()
        const entityQuery = match[2].trim()

        const [propResults, entityResults] = await Promise.all([
          search(propQuery, 'property'),
          search(entityQuery, 'item'),
        ])

        if (propResults.length === 0) return `Could not find property: ${propQuery}`
        if (entityResults.length === 0) return `Could not find entity: ${entityQuery}`

        const property = propResults[0]

        for (let entity of entityResults) {
          const val = await getPropValue(entity.id, property.id)

          if (!val) continue

          const propLabel = property.label.charAt(0).toUpperCase() + property.label.slice(1)
          const description = entity.description ? ` (${entity.description})` : ''

          return `${propLabel} of ${entity.label}${description} is ${val}.`
        }
        return `I found ${entity.label}, but no ${property.label} data is available.`
      }

      const form = document.getElementById('qa-form')
      const input = document.getElementById('question')
      const resultDiv = document.getElementById('result')
      const btn = document.getElementById('submit-btn')

      form.addEventListener('submit', async e => {
        e.preventDefault()
        btn.disabled = true
        resultDiv.style.display = 'block'
        resultDiv.innerHTML = '<em>Searching Wikidata...</em>'

        try {
          const response = await answer(input.value)
          resultDiv.textContent = response
        } catch (err) {
          resultDiv.innerHTML = `<span class="error">Error: ${err.message}</span>`
        } finally {
          btn.disabled = false
        }
      })
    </script>
  </body>
</html>
